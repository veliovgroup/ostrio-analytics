name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Pin overrides for Node 18
        if: startsWith(matrix.node-version, '18')
        run: |
          npm pkg set 'overrides.jsdom=^24.1.0'
          npm pkg set 'overrides.whatwg-url=^14.0.0'
          npm pkg set 'overrides.webidl-conversions=^7.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test